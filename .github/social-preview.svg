<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">claude-sync-by-skill — social preview card</title>
  <desc id="d">A dark 1280 by 640 card: title claude-sync-by-skill, tagline "One Claude Code environment across all your machines", key features, and the GitHub repo URL. Built with Claude Code, Apache-2.0, pure Python 3.</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b93f8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8b93f8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="640" fill="#0f1319"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8b93f8"/>
  <circle cx="1120" cy="560" r="240" fill="none" stroke="url(#ring)" stroke-width="46"/>
  <rect x="16" y="16" width="1248" height="608" rx="18" fill="none" stroke="#20262f" stroke-width="2"/>

  <text x="640" y="128" text-anchor="middle" fill="#8b93f8" font-size="19" font-weight="700" letter-spacing="4.5">BUILT WITH CLAUDE CODE</text>

  <text x="640" y="222" text-anchor="middle" fill="#f4f6f9" font-size="66" font-weight="700"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">claude-sync-by-skill</text>

  <text x="640" y="278" text-anchor="middle" fill="#aab3c0" font-size="28">One Claude Code environment across all your machines</text>

  <rect x="590" y="312" width="100" height="3" rx="1.5" fill="#8b93f8"/>

  <text x="640" y="386" text-anchor="middle" fill="#e7eaef" font-size="24" font-weight="500">Sync memory, plans, settings &amp; skills through any folder you mirror</text>
  <text x="640" y="428" text-anchor="middle" fill="#e7eaef" font-size="24" font-weight="500">Leave a note on one machine; pick it up as a task on another</text>

  <g font-size="18" font-weight="600">
    <rect x="356" y="470" width="176" height="40" rx="20" fill="#191f29" stroke="#2b333f"/>
    <text x="444" y="496" text-anchor="middle" fill="#c7cdd8">transport-agnostic</text>
    <rect x="548" y="470" width="184" height="40" rx="20" fill="#191f29" stroke="#2b333f"/>
    <text x="640" y="496" text-anchor="middle" fill="#c7cdd8">conflict-free notes</text>
    <rect x="748" y="470" width="176" height="40" rx="20" fill="#191f29" stroke="#2b333f"/>
    <text x="836" y="496" text-anchor="middle" fill="#c7cdd8">any task app</text>
  </g>

  <text x="640" y="566" text-anchor="middle" fill="#8b93f8" font-size="23" font-weight="600"
